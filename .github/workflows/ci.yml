name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land on their own clock, not on push. Monday 08:00 UTC.
    - cron: "0 8 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # wukong is macOS-only (FSEvents, launchd, the diff/store git
    # behavior), so CI runs on the platform it actually ships to.
    # The toolchain comes from rust-toolchain.toml — the same eyes as
    # local dev, upgraded only by a deliberate commit.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run --workspace
      - name: Live drills
        # The real daemon in a sandbox: quarantine, sticky resolutions,
        # sentinel discovery, package and settings reconcile — the
        # whole loop. `make drill` so new drills are picked up here
        # automatically.
        run: make drill

  audit:
    # RustSec advisory scan over Cargo.lock; platform-independent, so
    # the cheap runner does it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit
        run: cargo audit
