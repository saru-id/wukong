name: Release

# Fires when a GitHub release is published (notes stay hand-written;
# the machine only builds). Attaches an arm64 macOS tarball so a new
# machine can install wukong without a toolchain.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo build --release -p wukong -p wukongd
      - name: Package
        run: |
          STAGE="wukong-${{ github.event.release.tag_name }}-aarch64-apple-darwin"
          mkdir -p "$STAGE/share/man/man1" "$STAGE/share/zsh/site-functions"
          cp target/release/wukong target/release/wukongd "$STAGE/"
          ./target/release/wukong gen-man "$STAGE/share/man/man1"
          ./target/release/wukong gen-completions zsh > "$STAGE/share/zsh/site-functions/_wukong"
          tar czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
      - name: Rehearse day one from the tarball
        # The artifact we attach is the artifact we tested: unpack the
        # tarball into a fresh directory and run the full day-one
        # drill against those exact binaries.
        run: |
          STAGE="wukong-${{ github.event.release.tag_name }}-aarch64-apple-darwin"
          REHEARSAL=$(mktemp -d)
          tar xzf "$STAGE.tar.gz" -C "$REHEARSAL"
          WUKONG_BIN_DIR="$REHEARSAL/$STAGE" bash drills/dayone.sh
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" wukong-*.tar.gz wukong-*.tar.gz.sha256
