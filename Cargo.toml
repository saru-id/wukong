[workspace]
resolver = "3"
members = ["crates/core", "crates/wukongd", "crates/wukong"]

[workspace.package]
version = "0.12.1"
edition = "2024"
publish = false
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
wukong-core = { path = "crates/core" }

age = "0.12"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
notify = "8"
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
] }
plist = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
thiserror = "2"
jiff = "0.2"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "net",
    "time",
    "sync",
    "io-util",
    "signal",
] }
toml = "1"
toml_edit = "0.25"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Deliberate exceptions, each earning its keep:
missing_errors_doc = "allow" # error semantics live on the error types
missing_panics_doc = "allow" # the few expect()s state their invariant inline

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
# A daemon that panics should die cleanly and let launchd restart it,
# not unwind through an inconsistent event loop. Panic hooks (the
# TUI's terminal restore) still run before the abort.
panic = "abort"
